global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "audio-worker"
    static_configs:
      - targets:
          - "audio-worker:8000"

  - job_name: "document-worker"
    static_configs:
      - targets:
          - "document-worker:8000"

  - job_name: "llm-worker"
    static_configs:
      - targets:
          - "llm-worker:8000"

  - job_name: "embedding-worker"
    static_configs:
      - targets:
          - "embedding-worker:8000"

  - job_name: "solr-worker"
    static_configs:
      - targets:
          - "solr-worker:8000"