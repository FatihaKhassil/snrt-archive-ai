services:

  # ============================================================
  # BACKEND
  # ============================================================

  backend:

    build:
      context: ./backend-fastapi

    container_name: snrt_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend-fastapi:/app
      - ./storage:/storage

    env_file:
      - .env

    depends_on:
      mongodb:
        condition: service_started

      kafka:
        condition: service_healthy

    restart: always


  # ============================================================
  # AUDIO WORKER
  # ============================================================

  audio-worker:

    build:
      context: ./workers/audio-worker

    container_name: snrt_audio_worker

    volumes:
      - ./workers/audio-worker:/app
      - ./storage:/storage

    depends_on:
      kafka:
        condition: service_healthy

    restart: always


  # ============================================================
  # DOCUMENT WORKER
  # ============================================================

  document-worker:

    build:
      context: ./workers/document-worker

    container_name: snrt_document_worker

    volumes:
      - ./workers/document-worker:/app
      - ./storage:/storage

    depends_on:

      kafka:
        condition: service_healthy

      tika:
        condition: service_started

      mongodb:
        condition: service_started

    restart: always


  # ============================================================
  # LLM WORKER
  # ============================================================

  llm-worker:

    build:
      context: ./workers/llm-worker

    container_name: snrt_llm_worker

    volumes:
      - ./workers/llm-worker:/app

    depends_on:

      kafka:
        condition: service_healthy

      mongodb:
        condition: service_started

      ollama:
        condition: service_started

    restart: always


  # ============================================================
  # EMBEDDING WORKER
  # ============================================================

  embedding-worker:

    build:
      context: ./workers/embedding-worker

    container_name: snrt_embedding_worker

    volumes:
      - ./workers/embedding-worker:/app

    depends_on:

      kafka:
        condition: service_healthy

      mongodb:
        condition: service_started

      ollama:
        condition: service_started

      chroma:
        condition: service_started

    restart: always


  # ============================================================
  # SOLR WORKER
  # ============================================================

  solr-worker:

    build:
      context: ./workers/solr-worker

    container_name: snrt_solr_worker

    volumes:
      - ./workers/solr-worker:/app

    depends_on:

      kafka:
        condition: service_healthy

      mongodb:
        condition: service_started

      solr:
        condition: service_started

    restart: always


  # ============================================================
  # MONGODB
  # ============================================================

  mongodb:

    image: mongo:8.0

    container_name: snrt_mongodb

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db


  # ============================================================
  # KAFKA
  # ============================================================

  kafka:

    image: apache/kafka:latest

    container_name: snrt_kafka

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092"
        ]

      interval: 10s

      timeout: 10s

      retries: 10

      start_period: 20s


  # ============================================================
  # TIKA
  # ============================================================

  tika:

    image: apache/tika:latest

    container_name: snrt_tika

    ports:
      - "9998:9998"

    restart: always


  # ============================================================
  # OLLAMA
  # ============================================================

  ollama:

    image: ollama/ollama:latest

    container_name: snrt_ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    restart: always


  # ============================================================
  # CHROMA
  # ============================================================

  chroma:

    image: chromadb/chroma:latest

    container_name: snrt_chroma

    ports:
      - "8001:8000"

    volumes:
      - chroma_data:/data

    restart: always


  # ============================================================
  # SOLR
  # ============================================================

  solr:

    image: solr:9

    container_name: snrt_solr

    ports:
      - "8983:8983"

    command:
      - solr-precreate
      - snrt_documents

    restart: always


  # ============================================================
  # KAFKA UI
  # ============================================================

  kafka-ui:

    image: provectuslabs/kafka-ui:latest

    container_name: snrt_kafka_ui

    ports:
      - "8080:8080"

    depends_on:

      kafka:
        condition: service_healthy

    environment:

      KAFKA_CLUSTERS_0_NAME: snrt-cluster

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    restart: always


  # ============================================================
  # PROMETHEUS
  # ============================================================

  prometheus:

    image: prom/prometheus:latest

    container_name: snrt_prometheus

    ports:
      - "9090:9090"

    volumes:

      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

      - prometheus_data:/prometheus

    depends_on:

      audio-worker:
        condition: service_started

      document-worker:
        condition: service_started

      llm-worker:
        condition: service_started

      embedding-worker:
        condition: service_started

      solr-worker:
        condition: service_started

    restart: always


  # ============================================================
  # LOKI
  # ============================================================

  loki:

    image: grafana/loki:3.7.0

    container_name: snrt_loki

    ports:
      - "3100:3100"

    command:
      - "-config.file=/etc/loki/config.yaml"

    volumes:

      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro

      - loki_data:/loki

    restart: always


  # ============================================================
  # GRAFANA ALLOY
  # ============================================================

  alloy:

    image: grafana/alloy:latest

    container_name: snrt_alloy

    volumes:

      - ./loki/alloy-config.alloy:/etc/alloy/config.alloy:ro

      - /var/run/docker.sock:/var/run/docker.sock:ro

      - alloy_data:/var/lib/alloy

    command:

      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data

    depends_on:

      loki:
        condition: service_started

    restart: always


  # ============================================================
  # GRAFANA
  # ============================================================

  grafana:

    image: grafana/grafana:latest

    container_name: snrt_grafana

    ports:
      - "3000:3000"

    environment:

      # --------------------------------------------------------
      # SMTP - Email alerts
      # --------------------------------------------------------

      GF_SMTP_ENABLED: "true"

      GF_SMTP_HOST: "smtp.gmail.com:587"

      GF_SMTP_USER: "${GRAFANA_SMTP_USER}"

      GF_SMTP_PASSWORD: "${GRAFANA_SMTP_PASSWORD}"

      GF_SMTP_FROM_ADDRESS: "${GRAFANA_SMTP_FROM}"

      GF_SMTP_FROM_NAME: "SNRT Grafana"

    volumes:

      # --------------------------------------------------------
      # Grafana persistent data
      # --------------------------------------------------------

      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

      # --------------------------------------------------------
      # Grafana dashboards
      # --------------------------------------------------------

      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

      # --------------------------------------------------------
      # Grafana dashboard provisioning
      # --------------------------------------------------------

      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

      # --------------------------------------------------------
      # Grafana alerting provisioning
      # --------------------------------------------------------

      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro

    depends_on:

      prometheus:
        condition: service_started

      loki:
        condition: service_started

    restart: always


# ==============================================================
# VOLUMES
# ==============================================================

volumes:

  mongodb_data:

  ollama_data:

  chroma_data:

  prometheus_data:

  grafana_data:

  loki_data:

  alloy_data: